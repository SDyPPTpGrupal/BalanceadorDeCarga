<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura Parte 1</title>
<desc>Servidor compartido con container Docker (Ubuntu 24.04), puertos 22/80 internos mapeados a 2222/8080 externos, expuestos por túnel a dos casas remotas que compiten por el mismo puerto.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="60" width="260" height="320" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Servidor compartido</text>
<text x="60" y="108" font-family="sans-serif" font-size="12" fill="#185FA5">Operado por Plataforma</text>

<rect x="70" y="130" width="200" height="210" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="170" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Container Docker</text>
<text x="170" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Ubuntu 24.04</text>

<rect x="90" y="175" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170" y="199" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2C2C2A">Puerto 22 (SSH)</text>
<rect x="90" y="225" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170" y="249" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2C2C2A">Puerto 80 (HTTP)</text>

<line x1="250" y1="195" x2="300" y2="195" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="250" y1="245" x2="300" y2="245" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<text x="325" y="189" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">22→2222</text>
<text x="325" y="239" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">80→8080</text>
<line x1="300" y1="195" x2="350" y2="195" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="300" y1="245" x2="350" y2="245" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="350" y="175" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="410" y="199" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3C3489">Túnel :2222</text>
<rect x="350" y="225" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="410" y="249" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3C3489">Túnel :8080</text>

<line x1="470" y1="195" x2="485" y2="195" stroke="#444" stroke-width="1"/>
<line x1="470" y1="245" x2="485" y2="245" stroke="#444" stroke-width="1"/>
<line x1="485" y1="160" x2="485" y2="260" stroke="#444" stroke-width="1"/>
<line x1="485" y1="160" x2="500" y2="160" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="485" y1="260" x2="500" y2="260" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="500" y="130" width="140" height="60" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="570" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Casa remota A</text>

<rect x="500" y="230" width="140" height="60" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="570" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Casa remota B</text>

<text x="410" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">Compiten por el mismo puerto</text>
</svg>
