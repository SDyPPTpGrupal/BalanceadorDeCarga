services:
  balanceador:
    build:
      context: .
      args:
        APP_USER: ${APP_USER:-alumno}
        APP_PASSWORD: ${APP_PASSWORD:-alumno}
        PORT: 80
        SSH_PORT: 22
    ports:
      - "${PUBLIC_PORT:-89}:80"
      - "${SCP_PORT:-2222}:22"
    environment:
      PORT: 80
      SSH_PORT: 22
      APP_USER: ${APP_USER:-alumno}
      DEPLOY_DIR: /deploy
      OLD_BACKEND_URL: ${OLD_BACKEND_URL:-http://127.0.0.1:9001}
      NEW_BACKEND_URL: ${NEW_BACKEND_URL:-http://127.0.0.1:9002}
    volumes:
      - ./deploy:/deploy
    restart: unless-stopped
